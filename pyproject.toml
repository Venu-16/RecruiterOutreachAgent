[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiter-outreach-local"
version = "0.1.0"
description = "Local, review-first recruiter qualification and draft generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.3",
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite==3.1.2",
  "openpyxl==3.1.5",
  "pandas==3.0.6",
  "pydantic==2.14.1",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.32",
  "requests==2.34.2",
  "streamlit==1.66.0",
  "uvicorn==0.54.0",
]

[project.scripts]
recruiter-outreach = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"